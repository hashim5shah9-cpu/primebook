<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Solutions Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;700;800;900&family=Lexend:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="a4-landscape cover-page">

    <!-- Full Background Image -->
    <img src="gallery/img1.png" alt="Cover Background" class="bg-cover-img">

    <!-- Top Left Logo -->
    <img src="gallery/prime-solutions-Logo.png-2.png" alt="Prime Solutions Logo" class="ps-logo">

    <!-- Red Badge -->
    <div class="company-profile-badge">
      COMPANY <strong>PROFILE</strong>
    </div>

    <!-- PRIME Text -->
    <div class="text-prime">PRIME</div>

    <!-- SOLUTIONS Text -->
    <div class="text-solutions">SOLUTIONS</div>

    <!-- Black Overlay Box -->
    <div class="black-overlay-box">
      <div class="overlay-heading">A Risk Mitigation & Defect-Prevention Guide</div>
      <div class="overlay-subtext">Safeguarding premium finishes, reducing costly rework, and ensuring seamless project delivery.</div>
      <div class="overlay-locations">Auckland • Tauranga • Christchurch • Dunedin</div>
    </div>

    <!-- Footer Strip -->
    <footer class="bottom-footer-strip">
      <div class="footer-contact">
        <div class="f-item">
          <svg class="f-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          <span>0800 69 68 85</span>
        </div>
        <div class="f-item">
          <svg class="f-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          <span>www.primesolutions.co.nz</span>
        </div>
        <div class="f-item">
          <svg class="f-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <span>info@primesolutions.co.nz</span>
        </div>
      </div>
    </footer>

    <!-- Next Page Button -->
    <div class="nav-bottom">
      <button class="nav-btn next-btn" id="nextPageBtn" title="Next Page">&#10095;</button>
    </div>

  </div>

  <script>
    document.getElementById('nextPageBtn').addEventListener('click', function() {
      document.body.classList.add('fade-out');
      setTimeout(() => { window.location.href = 'page2.html'; }, 400);
    });
  </script>

</body>
</html>
